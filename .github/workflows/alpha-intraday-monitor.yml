name: Alpha Intradia Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * 1-5"
    - cron: "10 15 * * 1-5"

concurrency:
  group: alpha-intradia-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-alpha.txt
      - name: Placeholder monitor
        run: |
          python -m alpha_intraday.cli health
          echo "Monitor preparado: no ejecuta ordenes reales ni mantiene posiciones."
